    html { scroll-behavior: smooth; }

    /* ── Quiz ── */
    .quiz-wrap {
      max-width: 680px;
      margin: 0 auto;
    }

    .quiz-progress-bar {
      height: 3px;
      background: var(--linie);
      border-radius: 2px;
      margin-bottom: 2.5rem;
      overflow: hidden;
    }

    .quiz-progress-fill {
      height: 100%;
      background: var(--rot);
      border-radius: 2px;
      transition: width 0.45s ease;
      width: 0%;
    }

    .quiz-zaehler {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--grau);
      margin-bottom: 1.25rem;
    }

    .quiz-frage-text {
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.025em;
      margin-bottom: 2rem;
    }

    .quiz-antworten {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .quiz-btn {
      background: var(--weiss);
      border: 1.5px solid var(--linie);
      border-radius: 4px;
      padding: 1.1rem 1.5rem;
      text-align: left;
      cursor: pointer;
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 0.95rem;
      color: var(--text);
      line-height: 1.5;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      width: 100%;
    }

    .quiz-btn:hover:not(:disabled) {
      border-color: var(--rot);
      background: var(--rot-licht);
    }

    .quiz-btn:active:not(:disabled) { transform: scale(0.99); }

    .quiz-btn.selected {
      border-color: var(--rot);
      background: var(--rot-licht);
      font-weight: 600;
    }

    .quiz-btn:disabled { cursor: default; opacity: 0.65; }
    .quiz-btn.selected:disabled { opacity: 1; }

    .quiz-slide {
      animation: slideIn 0.3s ease forwards;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Ergebnis ── */
    .kompass-wrap {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 3rem;
      align-items: start;
    }

    .kompass-svg-wrap svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .ergebnis-lage {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--rot);
      display: block;
      margin-bottom: 0.5rem;
    }

    .ergebnis-titel {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 1rem;
    }

    .ergebnis-text {
      font-size: 0.92rem;
      color: var(--grau);
      line-height: 1.65;
      margin-bottom: 1.5rem;
      max-width: 380px;
    }

    .ergebnis-vergleich {
      background: var(--warm);
      border-left: 3px solid var(--rot);
      padding: 1rem 1.25rem;
      font-size: 0.88rem;
      color: var(--text);
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }

    .ergebnis-vergleich strong { color: var(--rot); }

    .ergebnis-cta { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }

    .btn-neu {
      background: none;
      border: 1.5px solid var(--linie);
      border-radius: 2px;
      padding: 0.75rem 1.25rem;
      font-family: 'Outfit', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--grau);
      transition: border-color 0.15s, color 0.15s;
    }

    .btn-neu:hover { border-color: var(--rot); color: var(--rot); }

    @media (max-width: 900px) {
      .kompass-wrap { grid-template-columns: 1fr; gap: 2rem; }
      .kompass-svg-wrap svg { max-width: 360px; }
    }

    @media (max-width: 640px) {
      .quiz-frage-text { font-size: 1.15rem; }
    }

        { text: 'What do you think about the welfare state?', antworten: [
          { text: 'It\'s too generous – it creates dependency rather than individual responsibility.', x: +1, y: -2 },
          { text: 'It\'s right – but needs to become more efficient and better targeted.', x: +1, y: +1 },
          { text: 'It\'s too weak – we need more social protection for everyone.', x: -1, y: +2 }
        ]},
        { text: 'How should climate change be addressed?', antworten: [
          { text: 'Through market mechanisms – without state intervention in the economy.', x: +2, y: -1 },
          { text: 'With smart regulations that strengthen both the economy and the environment.', x: +1, y: +2 },
          { text: 'With clear bans and laws – even if it costs in the short term.', x: -2, y: +2 }
        ]},
        { text: 'Who should organise and finance education?', antworten: [
          { text: 'The market – competition and individual responsibility bring more quality.', x: +2, y: -2 },
          { text: 'The state – good education for all is the best economic policy.', x: 0, y: +2 },
          { text: 'The state, entirely and free of charge – education must not be a privilege.', x: -1, y: +1 }
        ]},
        { text: 'What is your position on labour market regulation?', antworten: [
          { text: 'Less regulation – flexibility benefits both employers and employees.', x: +2, y: -1 },
          { text: 'Fair minimum standards – not too much, not too little.', x: +1, y: +1 },
          { text: 'Strong workers\' rights and trade unions are indispensable.', x: -2, y: +2 }
        ]},
        { text: 'What is the main purpose of a successful company?', antworten: [
          { text: 'Generate profit – this creates long-term prosperity for everyone.', x: +2, y: -2 },
          { text: 'Create value – for shareholders, employees and society.', x: +1, y: +2 },
          { text: 'Serve society – profit is a means, not an end in itself.', x: -1, y: +2 }
        ]}
      ]
    }
  };

  const T = TEXTS[_lang in TEXTS ? _lang : 'de'];

  // ══════════════════════════════════════════════════════════════════
  // HALTUNGSKOMPASS – Konfiguration
  // ══════════════════════════════════════════════════════════════════
  const CONFIG = {
    severin: { x: 72, y: 78, label: 'Severin' },
    achsen:     T.achsen,
    quadranten: T.quadranten,
    fragen:     T.fragen
  };

  // ══════════════════════════════════════════════════════════════════
  // Logik (nicht ändern)
  // ══════════════════════════════════════════════════════════════════
  let aktFrage = 0;
  let pktX = 0;
  let pktY = 0;
  const MAX = CONFIG.fragen.length * 2;

  function norm(punkte) {
    return Math.round(((punkte + MAX) / (MAX * 2)) * 100);
  }

  function getQuadrant(x, y) {
    const q = CONFIG.quadranten;
    if (x >= 50 && y >= 50) return q.obenRechts;
    if (x <  50 && y >= 50) return q.obenLinks;
    if (x >= 50 && y <  50) return q.untenRechts;
    return q.untenLinks;
  }

  function renderFrage() {
    const pct = (aktFrage / CONFIG.fragen.length) * 100;
    document.getElementById('progressFill').style.width = pct + '%';

    const f = CONFIG.fragen[aktFrage];
    const btnHTML = f.antworten.map((a, i) =>
      `<button class="quiz-btn" onclick="waehle(${i})">${a.text}</button>`
    ).join('');

    document.getElementById('quizInhalt').innerHTML = `
      <div class="quiz-slide">
        <div class="quiz-zaehler">${T.frageVon(aktFrage + 1, CONFIG.fragen.length)}</div>
        <div class="quiz-frage-text">${f.text}</div>
        <div class="quiz-antworten">${btnHTML}</div>
      </div>
    `;
  }

  function waehle(idx) {
    document.querySelectorAll('.quiz-btn').forEach(b => b.disabled = true);
    document.querySelectorAll('.quiz-btn')[idx].classList.add('selected');

    const a = CONFIG.fragen[aktFrage].antworten[idx];
    pktX += a.x;
    pktY += a.y;

    setTimeout(() => {
      aktFrage++;
      if (aktFrage < CONFIG.fragen.length) {
        renderFrage();
      } else {
        renderErgebnis();
      }
    }, 380);
  }

  function renderErgebnis() {
    document.getElementById('progressFill').style.width = '100%';

    const userX = norm(pktX);
    const userY = norm(pktY);
    const sev   = CONFIG.severin;
    const quad  = getQuadrant(userX, userY);

    const dist      = Math.sqrt(Math.pow(userX - sev.x, 2) + Math.pow(userY - sev.y, 2));
    const aehnl     = Math.max(0, Math.round(100 - dist));
    const aehnlText = aehnl >= 70 ? T.aehnlTexte[0] : aehnl >= 45 ? T.aehnlTexte[1] : T.aehnlTexte[2];

    const W = 400, H = 440;
    const px = 54, py = 30;
    const cw = W - 2 * px;
    const ch = H - py - 72;
    const toX = v => px + (v / 100) * cw;
    const toY = v => (py + ch) - (v / 100) * ch;
    const mx = toX(50), my = toY(50);
    const ux = toX(userX), uy = toY(userY);
    const sx = toX(sev.x), sy = toY(sev.y);

    document.getElementById('kompassSvg').innerHTML = `
      <rect x="${px}" y="${py}" width="${cw/2}" height="${ch/2}" fill="#EBF5FB" opacity="0.55"/>
      <rect x="${mx}" y="${py}" width="${cw/2}" height="${ch/2}" fill="#FDF2F3" opacity="0.7"/>
      <rect x="${px}" y="${my}" width="${cw/2}" height="${ch/2}" fill="#F5F5F5" opacity="0.45"/>
      <rect x="${mx}" y="${my}" width="${cw/2}" height="${ch/2}" fill="#FFFBF0" opacity="0.45"/>
      <rect x="${px}" y="${py}" width="${cw}" height="${ch}" fill="none" stroke="#E8E8E8" stroke-width="1"/>
      <line x1="${mx}" y1="${py}" x2="${mx}" y2="${py+ch}" stroke="#D0D0D0" stroke-width="1" stroke-dasharray="5,4"/>
      <line x1="${px}" y1="${my}" x2="${px+cw}" y2="${my}" stroke="#D0D0D0" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="${px+7}" y="${py+16}" font-family="Outfit,sans-serif" font-size="9.5" fill="#9CA3AF" font-weight="600">${T.quadranten.obenLinks.name}</text>
      <text x="${mx+7}" y="${py+16}" font-family="Outfit,sans-serif" font-size="9.5" fill="#C9172A" font-weight="700">${T.quadranten.obenRechts.name}</text>
      <text x="${px+7}" y="${my+16}" font-family="Outfit,sans-serif" font-size="9.5" fill="#9CA3AF" font-weight="600">${T.quadranten.untenLinks.name}</text>
      <text x="${mx+7}" y="${my+16}" font-family="Outfit,sans-serif" font-size="9.5" fill="#9CA3AF" font-weight="600">${T.quadranten.untenRechts.name}</text>
      <text x="${px + cw/2}" y="${py - 10}" font-family="Outfit,sans-serif" font-size="9" fill="#9CA3AF" text-anchor="middle">↑ ${CONFIG.achsen.y.oben}</text>
      <text x="${px + cw/2}" y="${py + ch + 16}" font-family="Outfit,sans-serif" font-size="9" fill="#9CA3AF" text-anchor="middle">${CONFIG.achsen.y.unten} ↓</text>
      <text x="${px}" y="${py + ch + 34}" font-family="Outfit,sans-serif" font-size="9" fill="#9CA3AF">← ${CONFIG.achsen.x.links}</text>
      <text x="${px + cw}" y="${py + ch + 34}" font-family="Outfit,sans-serif" font-size="9" fill="#9CA3AF" text-anchor="end">${CONFIG.achsen.x.rechts} →</text>
      <line x1="${ux}" y1="${uy}" x2="${sx}" y2="${sy}" stroke="#C9172A" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.35"/>
      <circle cx="${sx}" cy="${sy}" r="9" fill="white" stroke="#C9172A" stroke-width="2"/>
      <circle cx="${sx}" cy="${sy}" r="4.5" fill="#C9172A"/>
      <text x="${sx + 13}" y="${sy + 4}" font-family="Outfit,sans-serif" font-size="10" fill="#C9172A" font-weight="700">${sev.label}</text>
      <circle cx="${ux}" cy="${uy}" r="12" fill="#C9172A" opacity="0.12">
        <animate attributeName="r" values="9;16;9" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.15;0.04;0.15" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="${ux}" cy="${uy}" r="7" fill="#C9172A"/>
      <text x="${ux}" y="${uy - 13}" font-family="Outfit,sans-serif" font-size="10" fill="#C9172A" font-weight="700" text-anchor="middle">${T.duLabel}</text>
    `;

    document.getElementById('ergebnisText').innerHTML = `
      <span class="ergebnis-lage">${T.deinQuadrant}</span>
      <div class="ergebnis-titel">${quad.name}</div>
      <p class="ergebnis-text">${quad.beschreibung}</p>
      <div class="ergebnis-vergleich">
        <strong>${T.uebereinstimmung(aehnl)}</strong><br>
        ${aehnlText} ${T.severinInfo}
      </div>
      <div class="ergebnis-cta">
        <a href="politik.html" class="btn">${T.btnPolitik}</a>
        <button class="btn-neu" onclick="neustart()">${T.btnNeu}</button>
      </div>
    `;

    document.getElementById('quiz-bereich').style.display = 'none';
    document.getElementById('ergebnis-bereich').style.display = 'block';
    setTimeout(() => {
      document.getElementById('ergebnis-bereich').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 50);
  }

  function neustart() {
    aktFrage = 0; pktX = 0; pktY = 0;
    document.getElementById('ergebnis-bereich').style.display = 'none';
    document.getElementById('quiz-bereich').style.display = 'block';
    document.getElementById('progressFill').style.width = '0%';
    renderFrage();
    document.getElementById('quiz-bereich').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // Start
  renderFrage();
  </script>
  <script src="assets/main.js"></script>
  <script src="assets/animations.js"></script>
  <script src="assets/i18n.js"></script>
</body>
</html>

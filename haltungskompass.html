  <style>
    html { scroll-behavior: smooth; }

    /* ── Quiz ── */
    .quiz-wrap {
      max-width: 680px;
      margin: 0 auto;
    }

    .quiz-progress-bar {
      height: 3px;
      background: var(--linie);
      border-radius: 2px;
      margin-bottom: 2.5rem;
      overflow: hidden;
    }

    .quiz-progress-fill {
      height: 100%;
      background: var(--rot);
      border-radius: 2px;
      transition: width 0.45s ease;
      width: 0%;
    }

    .quiz-zaehler {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--grau);
      margin-bottom: 1.25rem;
    }

    .quiz-frage-text {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }

    .quiz-likert-hint {
      font-size: 0.78rem;
      color: var(--grau);
      margin-bottom: 1.75rem;
    }

    .quiz-antworten {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .quiz-btn {
      background: var(--weiss);
      border: 1.5px solid var(--linie);
      border-radius: 4px;
      padding: 0.95rem 1.5rem;
      text-align: left;
      cursor: pointer;
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 0.92rem;
      color: var(--text);
      line-height: 1.4;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      width: 100%;
    }

    .quiz-btn:hover:not(:disabled) {
      border-color: var(--rot);
      background: var(--rot-licht);
    }

    .quiz-btn:active:not(:disabled) { transform: scale(0.99); }

    .quiz-btn.selected {
      border-color: var(--rot);
      background: var(--rot-licht);
      font-weight: 600;
    }

    .quiz-btn:disabled { cursor: default; opacity: 0.65; }
    .quiz-btn.selected:disabled { opacity: 1; }

    .quiz-slide {
      animation: slideIn 0.3s ease forwards;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Ergebnis ── */
    .kompass-wrap {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 3rem;
      align-items: start;
    }

    .kompass-svg-wrap svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .ergebnis-lage {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--rot);
      display: block;
      margin-bottom: 0.5rem;
    }

    .ergebnis-titel {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 1rem;
    }

    .ergebnis-text {
      font-size: 0.92rem;
      color: var(--grau);
      line-height: 1.65;
      margin-bottom: 1.5rem;
      max-width: 380px;
    }

    .ergebnis-vergleich {
      background: var(--warm);
      border-left: 3px solid var(--rot);
      padding: 1rem 1.25rem;
      font-size: 0.88rem;
      color: var(--text);
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }

    .ergebnis-vergleich strong { color: var(--rot); }

    .ergebnis-cta { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }

    .btn-neu {
      background: none;
      border: 1.5px solid var(--linie);
      border-radius: 2px;
      padding: 0.75rem 1.25rem;
      font-family: 'Outfit', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--grau);
      transition: border-color 0.15s, color 0.15s;
    }

    .btn-neu:hover { border-color: var(--rot); color: var(--rot); }

    /* ── Share Bar ── */
    .share-bar {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--linie);
      align-items: center;
    }

    .share-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--grau);
      width: 100%;
      margin-bottom: 0.1rem;
    }

    .btn-share {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.55rem 0.9rem;
      border-radius: 2px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      transition: opacity 0.15s;
      line-height: 1;
    }

    .btn-share:hover { opacity: 0.82; }
    .btn-share-x  { background: #000; color: #fff; }
    .btn-share-wa { background: #25D366; color: #fff; }
    .btn-share-li { background: #0077B5; color: #fff; }

    @media (max-width: 900px) {
      .kompass-wrap { grid-template-columns: 1fr; gap: 2rem; }
      .kompass-svg-wrap svg { max-width: 360px; }
    }

    @media (max-width: 640px) {
      .quiz-frage-text { font-size: 1.1rem; }
    }

        { text: 'Education and training should be accessible to all and largely state-financed.', dx: -1, dy: 2 },
        { text: 'Climate protection succeeds best through market incentives, not prohibitions.', dx: 2, dy: 0 },
        { text: 'Immigration is in the long run an economic and social enrichment for Switzerland.', dx: 1, dy: 1 },
        { text: 'Companies should not only generate profit but also take responsibility for society and the environment.', dx: 1, dy: 2 },
        { text: 'Protecting proven traditions and institutions is more important than rapid social change.', dx: -1, dy: -2 },
        { text: 'Basic healthcare and care must not be profit-oriented.', dx: -2, dy: 2 },
        { text: 'For tomorrow\'s challenges, we need more dialogue between the state, economy and civil society.', dx: 0, dy: 2 }
      ]
    }
  };

  const T = TEXTS[_lang in TEXTS ? _lang : 'de'];

  // ══════════════════════════════════════════════════════════════════
  // Konfiguration
  // ══════════════════════════════════════════════════════════════════
  const CONFIG = {
    severin:    { x: 72, y: 78, label: 'Severin' },
    achsen:     T.achsen,
    quadranten: T.quadranten,
    fragen:     T.fragen
  };

  // Likert-Gewichte: stimmt völlig=1 → stimmt gar nicht=-1
  const LIKERT_W = [1, 0.5, 0, -0.5, -1];

  // Achsen-Maxima aus den absoluten dx/dy-Summen
  const MAX_X = CONFIG.fragen.reduce(function(s, f) { return s + Math.abs(f.dx); }, 0);
  const MAX_Y = CONFIG.fragen.reduce(function(s, f) { return s + Math.abs(f.dy); }, 0);

  function normX(p) { return Math.round(((p + MAX_X) / (MAX_X * 2)) * 100); }
  function normY(p) { return Math.round(((p + MAX_Y) / (MAX_Y * 2)) * 100); }

  // ══════════════════════════════════════════════════════════════════
  // Quiz-Logik
  // ══════════════════════════════════════════════════════════════════
  var aktFrage = 0;
  var pktX = 0;
  var pktY = 0;

  function getQuadrant(x, y) {
    var q = CONFIG.quadranten;
    if (x >= 50 && y >= 50) return q.obenRechts;
    if (x <  50 && y >= 50) return q.obenLinks;
    if (x >= 50 && y <  50) return q.untenRechts;
    return q.untenLinks;
  }

  function renderFrage() {
    var pct = (aktFrage / CONFIG.fragen.length) * 100;
    document.getElementById('progressFill').style.width = pct + '%';

    var f = CONFIG.fragen[aktFrage];
    var btnHTML = T.likert.map(function(label, i) {
      return '<button class="quiz-btn" onclick="waehle(' + i + ')">' + label + '</button>';
    }).join('');

    document.getElementById('quizInhalt').innerHTML =
      '<div class="quiz-slide">' +
        '<div class="quiz-zaehler">' + T.frageVon(aktFrage + 1, CONFIG.fragen.length) + '</div>' +
        '<div class="quiz-frage-text">' + f.text + '</div>' +
        '<div class="quiz-likert-hint">' + T.hinweis + '</div>' +
        '<div class="quiz-antworten">' + btnHTML + '</div>' +
      '</div>';
  }

  function waehle(idx) {
    document.querySelectorAll('.quiz-btn').forEach(function(b) { b.disabled = true; });
    document.querySelectorAll('.quiz-btn')[idx].classList.add('selected');

    var f = CONFIG.fragen[aktFrage];
    pktX += f.dx * LIKERT_W[idx];
    pktY += f.dy * LIKERT_W[idx];

    setTimeout(function() {
      aktFrage++;
      if (aktFrage < CONFIG.fragen.length) {
        renderFrage();
      } else {
        var userX = normX(pktX);
        var userY = normY(pktY);
        history.replaceState({}, '', window.location.pathname + '?x=' + userX + '&y=' + userY);
        renderErgebnisMit(userX, userY);
      }
    }, 380);
  }

  function renderErgebnisMit(userX, userY) {
    document.getElementById('progressFill').style.width = '100%';

    var sev   = CONFIG.severin;
    var quad  = getQuadrant(userX, userY);
    var dist  = Math.sqrt(Math.pow(userX - sev.x, 2) + Math.pow(userY - sev.y, 2));
    var aehnl = Math.max(0, Math.round(100 - dist));
    var aehnlText = aehnl >= 70 ? T.aehnlTexte[0] : aehnl >= 45 ? T.aehnlTexte[1] : T.aehnlTexte[2];

    var W = 400, H = 440;
    var px = 54, py = 30;
    var cw = W - 2 * px;
    var ch = H - py - 72;
    var toX = function(v) { return px + (v / 100) * cw; };
    var toY = function(v) { return (py + ch) - (v / 100) * ch; };
    var mx = toX(50), my = toY(50);
    var ux = toX(userX), uy = toY(userY);
    var sx = toX(sev.x), sy = toY(sev.y);

    document.getElementById('kompassSvg').innerHTML =
      '<rect x="' + px + '" y="' + py + '" width="' + (cw/2) + '" height="' + (ch/2) + '" fill="#EBF5FB" opacity="0.55"/>' +
      '<rect x="' + mx + '" y="' + py + '" width="' + (cw/2) + '" height="' + (ch/2) + '" fill="#FDF2F3" opacity="0.7"/>' +
      '<rect x="' + px + '" y="' + my + '" width="' + (cw/2) + '" height="' + (ch/2) + '" fill="#F5F5F5" opacity="0.45"/>' +
      '<rect x="' + mx + '" y="' + my + '" width="' + (cw/2) + '" height="' + (ch/2) + '" fill="#FFFBF0" opacity="0.45"/>' +
      '<rect x="' + px + '" y="' + py + '" width="' + cw + '" height="' + ch + '" fill="none" stroke="#E8E8E8" stroke-width="1"/>' +
      '<line x1="' + mx + '" y1="' + py + '" x2="' + mx + '" y2="' + (py+ch) + '" stroke="#D0D0D0" stroke-width="1" stroke-dasharray="5,4"/>' +
      '<line x1="' + px + '" y1="' + my + '" x2="' + (px+cw) + '" y2="' + my + '" stroke="#D0D0D0" stroke-width="1" stroke-dasharray="5,4"/>' +
      '<text x="' + (px+7) + '" y="' + (py+16) + '" font-family="Outfit,sans-serif" font-size="9.5" fill="#9CA3AF" font-weight="600">' + T.quadranten.obenLinks.name + '</text>' +
      '<text x="' + (mx+7) + '" y="' + (py+16) + '" font-family="Outfit,sans-serif" font-size="9.5" fill="#C9172A" font-weight="700">' + T.quadranten.obenRechts.name + '</text>' +
      '<text x="' + (px+7) + '" y="' + (my+16) + '" font-family="Outfit,sans-serif" font-size="9.5" fill="#9CA3AF" font-weight="600">' + T.quadranten.untenLinks.name + '</text>' +
      '<text x="' + (mx+7) + '" y="' + (my+16) + '" font-family="Outfit,sans-serif" font-size="9.5" fill="#9CA3AF" font-weight="600">' + T.quadranten.untenRechts.name + '</text>' +
      '<text x="' + (px + cw/2) + '" y="' + (py - 10) + '" font-family="Outfit,sans-serif" font-size="9" fill="#9CA3AF" text-anchor="middle">↑ ' + CONFIG.achsen.y.oben + '</text>' +
      '<text x="' + (px + cw/2) + '" y="' + (py + ch + 16) + '" font-family="Outfit,sans-serif" font-size="9" fill="#9CA3AF" text-anchor="middle">' + CONFIG.achsen.y.unten + ' ↓</text>' +
      '<text x="' + px + '" y="' + (py + ch + 34) + '" font-family="Outfit,sans-serif" font-size="9" fill="#9CA3AF">← ' + CONFIG.achsen.x.links + '</text>' +
      '<text x="' + (px + cw) + '" y="' + (py + ch + 34) + '" font-family="Outfit,sans-serif" font-size="9" fill="#9CA3AF" text-anchor="end">' + CONFIG.achsen.x.rechts + ' →</text>' +
      '<line x1="' + ux + '" y1="' + uy + '" x2="' + sx + '" y2="' + sy + '" stroke="#C9172A" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.35"/>' +
      '<circle cx="' + sx + '" cy="' + sy + '" r="9" fill="white" stroke="#C9172A" stroke-width="2"/>' +
      '<circle cx="' + sx + '" cy="' + sy + '" r="4.5" fill="#C9172A"/>' +
      '<text x="' + (sx + 13) + '" y="' + (sy + 4) + '" font-family="Outfit,sans-serif" font-size="10" fill="#C9172A" font-weight="700">' + sev.label + '</text>' +
      '<circle cx="' + ux + '" cy="' + uy + '" r="12" fill="#C9172A" opacity="0.12"><animate attributeName="r" values="9;16;9" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.04;0.15" dur="2.2s" repeatCount="indefinite"/></circle>' +
      '<circle cx="' + ux + '" cy="' + uy + '" r="7" fill="#C9172A"/>' +
      '<text x="' + ux + '" y="' + (uy - 13) + '" font-family="Outfit,sans-serif" font-size="10" fill="#C9172A" font-weight="700" text-anchor="middle">' + T.duLabel + '</text>';

    var pageUrl = 'https://www.severinstadler.ch/haltungskompass.html?x=' + userX + '&y=' + userY;
    var shareText = T.shareText(quad.name);

    document.getElementById('ergebnisText').innerHTML =
      '<span class="ergebnis-lage">' + T.deinQuadrant + '</span>' +
      '<div class="ergebnis-titel">' + quad.name + '</div>' +
      '<p class="ergebnis-text">' + quad.beschreibung + '</p>' +
      '<div class="ergebnis-vergleich"><strong>' + T.uebereinstimmung(aehnl) + '</strong><br>' + aehnlText + ' ' + T.severinInfo + '</div>' +
      '<div class="ergebnis-cta">' +
        '<a href="politik.html" class="btn">' + T.btnPolitik + '</a>' +
        '<button class="btn-neu" onclick="neustart()">' + T.btnNeu + '</button>' +
      '</div>' +
      '<div class="share-bar">' +
        '<div class="share-label">' + T.shareLabel + '</div>' +
        '<a href="https://x.com/intent/tweet?text=' + encodeURIComponent(shareText) + '&url=' + encodeURIComponent(pageUrl) + '" target="_blank" rel="noopener" class="btn-share btn-share-x">' +
          '<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.737l7.731-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>' +
          ' X' +
        '</a>' +
        '<a href="https://wa.me/?text=' + encodeURIComponent(shareText + ' ' + pageUrl) + '" target="_blank" rel="noopener" class="btn-share btn-share-wa">' +
          '<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>' +
          ' WhatsApp' +
        '</a>' +
        '<a href="https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(pageUrl) + '" target="_blank" rel="noopener" class="btn-share btn-share-li">' +
          '<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>' +
          ' LinkedIn' +
        '</a>' +
      '</div>';

    document.getElementById('quiz-bereich').style.display = 'none';
    document.getElementById('ergebnis-bereich').style.display = 'block';
    setTimeout(function() {
      document.getElementById('ergebnis-bereich').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 50);
  }

  function neustart() {
    aktFrage = 0; pktX = 0; pktY = 0;
    history.replaceState({}, '', window.location.pathname);
    document.getElementById('ergebnis-bereich').style.display = 'none';
    document.getElementById('quiz-bereich').style.display = 'block';
    document.getElementById('progressFill').style.width = '0%';
    renderFrage();
    document.getElementById('quiz-bereich').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // Start: URL-Parameter prüfen (geteiltes Ergebnis)
  var urlP = new URLSearchParams(window.location.search);
  var sharedX = parseInt(urlP.get('x'));
  var sharedY = parseInt(urlP.get('y'));
  if (!isNaN(sharedX) && !isNaN(sharedY) && sharedX >= 0 && sharedX <= 100 && sharedY >= 0 && sharedY <= 100) {
    document.getElementById('quiz-bereich').style.display = 'none';
    document.getElementById('ergebnis-bereich').style.display = 'block';
    renderErgebnisMit(sharedX, sharedY);
  } else {
    renderFrage();
  }
  </script>
  <script src="assets/main.js"></script>
  <script src="assets/animations.js"></script>
  <script src="assets/i18n.js"></script>
</body>
</html>
